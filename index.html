<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihanna Store | ريحانة ستور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-black: #000; --main-white: #fff; --gray-bg: #f9f9f9; --gold: #D4AF37; }
        body { background-color: var(--main-white); color: var(--main-black); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding-bottom: 80px; text-align: right; overflow-x: hidden; }

        /* شاشة الترحيب */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .splash-logo { width: 100px; border: 1px solid #000; border-radius: 50%; padding: 5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* شريط الإعلانات */
        .announcement-bar { background: var(--main-black); color: var(--main-white); font-size: 11px; font-weight: bold; padding: 10px 0; overflow: hidden; white-space: nowrap; }
        .scrolling-text { display: inline-block; animation: scrollLeft 25s linear infinite; }
        @keyframes scrollLeft { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* الهيدر والقائمة الجانبية */
        header { padding: 20px; text-align: center; position: relative; }
        .menu-bar { position: absolute; top: 25px; right: 20px; font-size: 24px; cursor: pointer; color: #000; }
        .logo { width: 80px; height: 80px; border-radius: 50%; border: 1px solid #000; object-fit: cover; }

        /* تصميم القائمة الجانبية (Side Menu) */
        .side-menu { position: fixed; top: 0; right: -100%; width: 280px; height: 100%; background: #fff; z-index: 5000; transition: 0.4s; box-shadow: -5px 0 15px rgba(0,0,0,0.1); padding: 40px 20px; text-align: right; }
        .side-menu.open { right: 0; }
        .close-menu { position: absolute; top: 15px; left: 15px; font-size: 25px; cursor: pointer; }
        .menu-item { display: block; padding: 15px 0; border-bottom: 1px solid #eee; text-decoration: none; color: #333; font-weight: bold; font-size: 14px; }
        .menu-item i { margin-left: 10px; color: var(--gold); }

        /* الفئات */
        .categories-container { display: flex; gap: 15px; overflow-x: auto; padding: 15px; background: #fff; scrollbar-width: none; border-bottom: 1px solid #eee; }
        .categories-container::-webkit-scrollbar { display: none; }
        .cat-item { min-width: 90px; text-align: center; cursor: pointer; }
        .cat-icon { width: 55px; height: 55px; background: var(--gray-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; border: 1px solid transparent; transition: 0.3s; font-size: 18px; }
        .cat-item.active .cat-icon { border-color: #000; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .cat-item span { font-size: 10px; font-weight: 600; }

        /* المنتجات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .product-card { background: #fff; border: 1px solid #eee; border-radius: 12px; overflow: hidden; display: none; flex-direction: column; }
        .product-card.show { display: flex; }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .product-info { padding: 12px; text-align: center; }
        .price-badge { background: #000; color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* نافذة المنتج */
        .product-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 3000; display: none; overflow-y: auto; padding: 25px; box-sizing: border-box; }
        .buy-now-btn { background: #000; color: #fff; width: 100%; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; margin-top: 15px; }

        /* شريط التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; z-index: 4000; border-top: 1px solid #eee; }
        .nav-item { color: #888; text-decoration: none; font-size: 11px; text-align: center; cursor: pointer; position: relative; }
        .nav-item.active { color: #000; }
        .cart-count { background: #000; color: #fff; border-radius: 50%; padding: 2px 6px; font-size: 10px; position: absolute; top: -5px; right: 10px; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="Logo_1789.jpg" class="splash-logo">
        <h2 style="letter-spacing: 4px; font-weight: 300; margin-top: 20px;">RIHANNA STORE</h2>
    </div>

    <div class="announcement-bar">
        <div class="scrolling-text">✨ توصيل مجاني لكافة الولايات التركية ✨ صياغة يدوية فضة عيار 925 ✨ خصومات بمناسبة الافتتاح ✨</div>
    </div>

    <header>
        <div class="menu-bar" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <img src="Logo_1789.jpg" class="logo">
        <h1 style="font-weight: 300; letter-spacing: 2px; margin-top: 10px;">RIHANNA STORE</h1>
    </header>

    <div id="side-menu" class="side-menu">
        <div class="close-menu" onclick="toggleMenu()">×</div>
        <a href="#" class="menu-item"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="https://wa.me/905387091109" class="menu-item"><i class="fas fa-shopping-cart"></i> لتقديم طلب جديد</a>
        <a href="https://wa.me/905387091109" class="menu-item"><i class="fas fa-comment-dots"></i> الشكاوى والاقتراحات</a>
        <a href="https://www.instagram.com/rihanna.store.tr/" class="menu-item"><i class="fab fa-instagram"></i> تابعونا على إنستغرام</a>
    </div>

    <div class="categories-container">
        <div class="cat-item active" onclick="filterCategory('all', this)">
            <div class="cat-icon"><i class="fas fa-th-large"></i></div><span>الكل</span>
        </div>
        <div class="cat-item" onclick="filterCategory('set', this)">
            <div class="cat-icon"><i class="fas fa-gem"></i></div><span>أطقم فاخرة</span>
        </div>
        <div class="cat-item" onclick="filterCategory('necklaces', this)">
            <div class="cat-icon"><i class="fas fa-magic"></i></div><span>قلادات</span>
        </div>
        <div class="cat-item" onclick="filterCategory('rings', this)">
            <div class="cat-icon"><i class="fas fa-ring"></i></div><span>خواتم</span>
        </div>
        <div class="cat-item" onclick="filterCategory('bracelets', this)">
            <div class="cat-icon"><i class="fas fa-hands"></i></div><span>أساور</span>
        </div>
        <div class="cat-item" onclick="filterCategory('women', this)">
            <div class="cat-icon"><i class="fas fa-venus"></i></div><span>مصوغات نسائية</span>
        </div>
        <div class="cat-item" onclick="filterCategory('men', this)">
            <div class="cat-icon"><i class="fas fa-mars"></i></div><span>مصوغات شبابية</span>
        </div>
    </div>

    <div class="grid" id="main-grid"></div>

    <div id="product-page" class="product-page">
        <span class="close-page" onclick="closeProduct()"><i class="fas fa-arrow-right"></i> عودة</span>
        <img id="d-img" class="detail-img">
        <h1 id="d-title" class="detail-title"></h1>
        <div class="detail-desc" id="d-desc"></div>
        <button class="buy-now-btn" onclick="addToCart()">إضافة للسلة والطلب عبر واتساب 🛍️</button>
    </div>

    <nav class="bottom-nav">
        <a href="https://wa.me/905387091109" class="nav-item"><i class="fab fa-whatsapp"></i>تواصل</a>
        <div class="nav-item" onclick="sendOrder()" style="color:#000;">
            <i class="fas fa-shopping-bag"></i>السلة
            <span class="cart-count" id="cart-num">0</span>
        </div>
        <div class="nav-item active"><i class="fas fa-home"></i>الرئيسية</div>
        <a href="https://www.instagram.com/rihanna.store.tr?igsh=MWRkN2w5MWl2bTU1aw%3D%3D&utm_source=qr" class="nav-item"><i class="fab fa-instagram"></i>إنستا</a>
    </nav>

    <script>
        setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => document.getElementById('splash').style.display = 'none', 800); }, 2500);

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('open'); }

        const products = [
            { id: 1, category: 'rings', name: "خاتم فضة ملكي", price: 1500, img: "IMG_1787.jpeg", desc: "خاتم ملكي فاخر مصاغ من الفضة عيار 925، مرصع بأحجار الزركون السويسري. صياغة يدوية تضمن لكِ بريقاً دائماً وفخامة لا تضاهى." },
            { id: 2, category: 'rings', name: "خاتم ومحبس سوليتير", price: 2800, img: "IMG_1762.jpeg", desc: "طقم الأناقة الخالدة لكل عروس. قطعتان من الفضة النقية بتصميم السوليتير الكلاسيكي، مطلية بالروديوم لحماية اللمعان." },
            { id: 3, category: 'set', name: "طقم أبجدية الحب", price: 3000, img: "IMG_1836.jpeg", desc: "طقم مخصص يحمل حرفك المفضل بصياغة يدوية دقيقة في ورشات إسطنبول. يجمع بين العاطفة والفخامة المطلقة." }
        ];

        let cart = [];
        let selectedProduct = null;

        function renderProducts(cat = 'all') {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = products.map(p => `
                <div class="product-card ${cat === 'all' || p.category === cat ? 'show' : ''}" onclick="openProduct(${p.id})">
                    <img src="${p.img}" class="product-img">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="price-badge">TL ${p.price}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            renderProducts(cat);
        }

        function openProduct(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('d-img').src = selectedProduct.img;
            document.getElementById('d-title').innerText = selectedProduct.name;
            document.getElementById('d-desc').innerText = selectedProduct.desc;
            document.getElementById('product-page').style.display = 'block';
        }

        function closeProduct() { document.getElementById('product-page').style.display = 'none'; }

        function addToCart() {
            cart.push(selectedProduct);
            document.getElementById('cart-num').innerText = cart.length;
            alert("تمت الإضافة للسلة بنجاح ✅");
            closeProduct();
        }

        function sendOrder() {
            if (cart.length === 0) return alert("السلة فارغة!");
            let msg = "مرحباً ريحانة ستور، أود طلب المشتريات التالية:\n\n";
            cart.forEach((p, i) => msg += `${i+1}. ${p.name} (${p.price} TL)\n`);
            window.location.href = `https://wa.me/905387091109?text=${encodeURIComponent(msg)}`;
        }

        renderProducts();
    </script>
</body>
</html>

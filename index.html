<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihanna Store | ريحانة ستور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&display=swap');
        :root { --main-black: #000; --gold: #D4AF37; --sale: #e74c3c; --white: #fff; }
        body { background-color: var(--white); color: var(--main-black); font-family: 'Tajawal', sans-serif; margin: 0; padding-bottom: 90px; text-align: right; overflow-x: hidden; }

        .announcement-bar { background: #000; color: #fff; font-size: 14px; font-weight: 800; padding: 12px 0; overflow: hidden; white-space: nowrap; border-bottom: 2px solid var(--gold); }
        .scrolling-text { display: inline-block; animation: scrollLeft 25s linear infinite; }
        @keyframes scrollLeft { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        header { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        .logo { width: 85px; height: 85px; border-radius: 50%; border: 1px solid #000; object-fit: cover; }
        .brand-name { font-size: 22px; font-weight: 300; letter-spacing: 4px; margin-top: 10px; }

        .category-card { position: relative; width: 92%; margin: 15px auto; height: 160px; border-radius: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; border: 1px solid #eee; cursor: pointer; }
        .category-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1; }
        .category-card span { position: relative; z-index: 2; color: #fff; font-size: 22px; font-weight: 800; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 10px; overflow: hidden; text-align: center; position: relative; cursor: pointer; padding-bottom: 10px; }
        .sale-badge { position: absolute; top: 8px; left: 8px; background: var(--sale); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; z-index: 3; }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }

        .new-price { color: var(--main-black); font-weight: 800; font-size: 24px; margin-top: 4px; display: block; }
        .old-price { text-decoration: line-through; color: #999; font-size: 18px; margin-left: 10px; }

        .product-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: none; overflow-y: auto; padding: 25px; box-sizing: border-box; }
        .close-btn { font-size: 15px; font-weight: 800; border: 2px solid #000; padding: 10px 30px; border-radius: 8px; cursor: pointer; display: inline-block; margin-bottom: 20px; }
        
        /* أزرار الطلب الجديد */
        .order-options { display: flex; gap: 10px; margin-top: 20px; }
        .order-btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; text-decoration: none; text-align: center; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .whatsapp-btn { background: #25D366; }
        .insta-btn { background: #E1306C; }
        .cart-btn-round { background: #f0f0f0; color: #000; padding: 15px; border-radius: 10px; border: none; font-weight: 800; width: 100%; margin-top: 10px; cursor: pointer; }

        .desc-box { background: #f9f9f9; padding: 20px; border-radius: 12px; line-height: 1.8; margin: 15px 0; border-right: 5px solid var(--gold); font-size: 16px; text-align: right; }
        .review-section { border-top: 1px solid #eee; margin-top: 30px; padding-top: 20px; padding-bottom: 30px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 5000; }
        .nav-item { color: #666; text-decoration: none; font-size: 11px; text-align: center; cursor: pointer; flex: 1; }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="announcement-bar">
        <div class="scrolling-text">✨ شحن مجاني لكافة ولايات تركيا 🇹🇷 ✨ صياغة يدوية فضة عيار 925 ✨ تشكيلة ÇELİK الفاخرة ✨</div>
    </div>

    <header>
        <img src="Logo_1789.jpg" class="logo">
        <h1 class="brand-name">RIHANNA STORE</h1>
    </header>

    <div id="home-view">
        <div class="category-card" style="background-image: url('IMG_1762.jpeg');" onclick="showSubCats('silver')">
            <span>عالم الفضة 925</span>
        </div>
        <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1611591437281-460bfbe1220a?q=80&w=1000');" onclick="showSubCats('steel')">
            <span>عالم ÇELİK الفاخر</span>
        </div>
    </div>

    <div id="sub-cats-view" style="display:none; padding-top: 10px;">
        <div onclick="goHome()" style="padding: 15px; cursor:pointer; font-weight: 800;"><i class="fas fa-arrow-right"></i> العودة للرئيسية</div>
        <div id="sub-cats-list"></div>
    </div>

    <div id="prods-view" style="display:none; padding-top: 10px;">
        <div onclick="backToCats()" style="padding: 15px; cursor:pointer; font-weight: 800;"><i class="fas fa-arrow-right"></i> العودة للمجموعات</div>
        <div class="grid" id="main-grid"></div>
    </div>

    <div id="product-page" class="product-page">
        <div class="close-btn" onclick="closeProduct()">إغلاق</div>
        <img id="d-img" style="width:100%; border-radius:15px;">
        <h2 id="d-title" style="margin-top:20px; font-weight: 800;"></h2>
        <div style="margin: 15px 0;">
            <span id="d-old-price" class="old-price"></span>
            <span id="d-new-price" class="new-price" style="display: inline; color: var(--gold);"></span>
        </div>
        
        <div class="desc-box" id="d-desc"></div>

        <p style="font-weight: 800; margin-top: 20px;">اطلبيها الآن عبر اختيار وسيلتكِ المفضلة:</p>
        <div class="order-options">
            <a href="#" id="order-whatsapp" class="order-btn whatsapp-btn"><i class="fab fa-whatsapp"></i> واتساب</a>
            <a href="#" id="order-insta" class="order-btn insta-btn"><i class="fab fa-instagram"></i> إنستقرام</a>
        </div>
        <button class="cart-btn-round" onclick="addToCart()">✨ أضف للسلة (للتذكير)</button>

        <div class="review-section">
            <h4 style="font-weight: 800;">آراء الزبائن ⭐</h4>
            <div id="user-reviews" style="margin-bottom:20px; color:#555;">لا توجد تقييمات بعد..</div>
            <button class="cart-btn-round" style="background:#000; color:#fff;" onclick="alert('شاركينا رأيك عبر الواتساب ✨')">أضيفي تقييمكِ الآن</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="https://wa.me/905387091109" class="nav-item"><i class="fab fa-whatsapp"></i>تواصل</a>
        <div class="nav-item" onclick="alert('السلة للمراجعة فقط، اطلب المباشر متاح الآن ✅')"><i class="fas fa-shopping-bag"></i>السلة</div>
        <div class="nav-item" onclick="goHome()"><i class="fas fa-home"></i>الرئيسية</div>
        <a href="https://www.instagram.com/rihanna.store.tr" class="nav-item"><i class="fab fa-instagram"></i>إنستا</a>
    </nav>

    <script>
        const products = [
            { id: 1, mat: 'silver', cat: 'set', name: "طقم أبجدية الحب", oldPrice: 5000, newPrice: 3000, img: "IMG_1836.jpeg", desc: "<b>وصف المنتج:</b> طقم الأحرف الفاخر، صُمم ليكون حرفكِ الأول في كتاب الأناقة.<br><b>سر الصنعة:</b> فضة إسترلينية 925 مطلي بماء الذهب." },
            { id: 4, mat: 'silver', cat: 'necklaces', name: "قلادة الأحرف الملكية (إصدار الحب)", oldPrice: 3000, newPrice: 2000, img: "IMG_1895.jpeg", desc: "<b>✨ حرفكِ وحرف من تحبين:</b> قلادة تجمع بين حرفكِ وحرف من تحبين في قطعة واحدة.<br><b>⭐ الجودة:</b> فضة إسترلينية مطلية بماء الذهب.<br><b>🛠️ سر الصنعة:</b> حفر ليزر دقيق مرصع بالكرستال." }
        ];

        function showSubCats(mat) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('sub-cats-view').style.display = 'block';
            const list = document.getElementById('sub-cats-list');
            const cats = [
                {id:'necklaces', n:'مجموعة القلادات', img:'IMG_1895.jpeg'},
                {id:'set', n:'مجموعة الأطقم', img:'IMG_1836.jpeg'}
            ];
            list.innerHTML = cats.map(c => `<div class="category-card" style="background-image: url('${c.img}');" onclick="showProducts('${c.id}')"><span>${c.n}</span></div>`).join('');
        }

        function showProducts(cat) {
            document.getElementById('sub-cats-view').style.display = 'none';
            document.getElementById('prods-view').style.display = 'block';
            const grid = document.getElementById('main-grid');
            let filtered = products.filter(p => p.cat === cat);
            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openProduct(${p.id})">
                    <img src="${p.img}" class="product-img">
                    <div style="padding:10px; font-weight:800;">${p.name}</div>
                    <div style="padding-bottom:10px;">
                        <span class="old-price">${p.oldPrice} TL</span>
                        <span class="new-price">${p.newPrice} TL</span>
                    </div>
                </div>
            `).join('');
            window.scrollTo(0,0);
        }

        function openProduct(id) {
            const p = products.find(i => i.id === id);
            document.getElementById('d-img').src = p.img;
            document.getElementById('d-title').innerText = p.name;
            document.getElementById('d-old-price').innerText = p.oldPrice + " TL";
            document.getElementById('d-new-price').innerText = p.newPrice + " TL";
            document.getElementById('d-desc').innerHTML = p.desc;
            
            // تحديث روابط الطلب المباشر
            document.getElementById('order-whatsapp').href = `https://wa.me/905387091109?text=أهلاً ريحانة، أود طلب: ${p.name}`;
            document.getElementById('order-insta').href = `https://www.instagram.com/rihanna.store.tr`;
            
            document.getElementById('product-page').style.display = 'block';
        }

        function goHome() { 
            document.getElementById('home-view').style.display='block'; 
            document.getElementById('sub-cats-view').style.display='none'; 
            document.getElementById('prods-view').style.display='none'; 
            document.getElementById('product-page').style.display='none';
        }
        function backToCats() { document.getElementById('prods-view').style.display='none'; document.getElementById('sub-cats-view').style.display='block'; }
        function closeProduct() { document.getElementById('product-page').style.display='none'; }
        function addToCart() { alert("تم الحفظ في السلة المؤقتة ✅، يمكنكِ إتمام الطلب الآن عبر الواتساب."); }
    </script>
</body>
</html>

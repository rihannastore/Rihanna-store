<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihanna Store | ريحانة ستور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-black: #000; --main-white: #fff; --gray-soft: #f4f4f4; --gold: #D4AF37; }
        body { background-color: var(--main-white); color: var(--main-black); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; text-align: right; overflow-x: hidden; }

        /* شاشة الترحيب */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .splash-logo { width: 100px; border-radius: 50%; border: 1px solid #000; padding: 5px; }

        /* شريط الإعلانات: واضح جداً وعريض */
        .announcement-bar { background: var(--main-black); color: var(--main-white); font-size: 16px; font-weight: 900; padding: 16px 0; overflow: hidden; white-space: nowrap; border-bottom: 2px solid var(--gold); }
        .scrolling-text { display: inline-block; animation: scrollLeft 25s linear infinite; }
        @keyframes scrollLeft { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee; }
        .logo { width: 85px; height: 85px; border-radius: 50%; border: 1px solid #000; object-fit: cover; }
        .brand-name { font-size: 24px; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; margin-top: 10px; }

        /* بطاقات الفئات العريضة */
        .category-card { position: relative; width: 94%; margin: 15px auto; height: 170px; border-radius: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; background-size: cover; background-position: center; border: 1px solid #eee; transition: 0.3s; }
        .category-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); }
        .category-card span { position: relative; z-index: 2; color: #fff; font-size: 24px; font-weight: 500; text-shadow: 2px 2px 5px rgba(0,0,0,0.6); }

        /* شبكة المنتجات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; overflow: hidden; text-align: center; }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .price-badge { background: #000; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 15px; display: inline-block; }

        /* صفحة المنتج */
        .product-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 6000; display: none; overflow-y: auto; padding: 25px; box-sizing: border-box; }
        .close-btn { font-size: 16px; font-weight: bold; border: 2px solid #000; padding: 10px 30px; border-radius: 8px; cursor: pointer; display: inline-block; margin-bottom: 25px; }

        /* الشريط السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; z-index: 4000; border-top: 2px solid #eee; }
        .nav-item { color: #888; text-decoration: none; font-size: 12px; text-align: center; cursor: pointer; }
        .nav-item.active { color: #000; }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="Logo_1789.jpg" class="splash-logo">
        <h2 class="brand-name">RIHANNA STORE</h2>
    </div>

    <div class="announcement-bar">
        <div class="scrolling-text">✨ صياغة يدوية فضة عيار 925 ✨ تشكيلة ÇELİK الفاخرة لا يتغير لونها ✨ شحن مجاني لكافة الولايات ✨</div>
    </div>

    <header>
        <img src="Logo_1789.jpg" class="logo">
        <h1 class="brand-name">RIHANNA STORE</h1>
    </header>

    <div id="home-view">
        <div class="category-card" style="background-image: url('IMG_1762.jpeg');" onclick="showSubCategories('silver')">
            <span>عالم الفضة 925</span>
        </div>
        <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1611591437281-460bfbe1220a?q=80&w=1000');" onclick="showSubCategories('steel')">
            <span>مجموعة ÇELİK الفاخرة</span>
        </div>
    </div>

    <div id="sub-cats-view" style="display:none; padding: 20px 0;">
        <div onclick="goHome()" style="margin: 0 20px 20px; cursor:pointer; font-weight: 900; font-size: 18px;"><i class="fas fa-chevron-right"></i> العودة للاختيار الرئيسي</div>
        <div id="sub-cats-list"></div>
    </div>

    <div id="prods-view" style="display:none; padding:15px;">
        <div onclick="backToSubCats()" style="margin-bottom:20px; cursor:pointer; font-weight: 900; font-size: 18px;"><i class="fas fa-chevron-right"></i> العودة للمجموعات</div>
        <div class="grid" id="main-grid"></div>
    </div>

    <div id="product-page" class="product-page">
        <div class="close-btn" onclick="closeProduct()">إغلاق</div>
        <img id="d-img" style="width:100%; border-radius:15px;">
        <h2 id="d-title" style="margin-top:25px; border-bottom:2px solid #000; padding-bottom:12px;"></h2>
        <h3 id="d-price" style="color:var(--gold); font-size: 26px;"></h3>
        <p id="d-desc" style="line-height:1.8; color:#333; font-size:16px; margin-bottom:30px;"></p>
        <button onclick="addToCart()" style="background:#000; color:#fff; width:100%; padding:20px; border-radius:12px; border:none; font-weight:bold; font-size:18px;">إضافة للسلة والطلب ✅</button>
    </div>

    <nav class="bottom-nav">
        <a href="https://wa.me/905387091109" class="nav-item"><i class="fab fa-whatsapp"></i>تواصل</a>
        <div class="nav-item" onclick="sendOrder()" style="color:#000; position:relative;">
            <i class="fas fa-shopping-bag"></i>السلة
            <span id="cart-num" style="background:#000; color:#fff; border-radius:50%; padding:2px 8px; font-size:12px; position:absolute; top:-8px; right:12px;">0</span>
        </div>
        <div class="nav-item active" onclick="goHome()"><i class="fas fa-home"></i>الرئيسية</div>
        <a href="https://www.instagram.com/rihanna.store.tr?igsh=MWRkN2w5MWl2bTU1aw%3D%3D&utm_source=qr" class="nav-item"><i class="fab fa-instagram"></i>إنستا</a>
    </nav>

    <script>
        setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => document.getElementById('splash').style.display = 'none', 800); }, 2500);

        let currentMat = '';
        let cart = [];

        function showSubCategories(mat) {
            currentMat = mat;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('sub-cats-view').style.display = 'block';
            const list = document.getElementById('sub-cats-list');
            
            // الصور تم اختيارها لتكون فخمة ومطابقة لطلبك 100%
            const subCats = [
                {id:'set', n:'أطقم فاخرة', img:'IMG_1836.jpeg'},
                {id:'necklaces', n:'قلادات وسلاسل', img: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=1000'},
                {id:'rings', n:'خواتم ومحابس', img:'IMG_1762.jpeg'},
                {id:'bracelets', n:'أساور وبناجر', img:'https://images.unsplash.com/photo-1611591437281-460bfbe1220a?q=80&w=1000'},
                {id:'women', n:'مصوغات نسائية', img:'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=1000'},
                {id:'men', n:'مصوغات شبابية', img:'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000'}, // صورة خاتم رجالي فخم
                {id:'kids', n:'مصوغات الأطفال', img:'https://images.unsplash.com/photo-1601050690597-df056fb3ce09?q=80&w=1000'} // صورة بلاك طفل ناعم
            ];

            list.innerHTML = subCats.map(sc => `
                <div class="category-card" style="background-image: url('${sc.img}');" onclick="showProds('${sc.id}')">
                    <span>${sc.n}</span>
                </div>
            `).join('');
        }

        const products = [
            { id: 1, mat: 'silver', cat: 'rings', name: "خاتم فضة ملكي", price: 1500, img: "IMG_1787.jpeg", desc: "خاتم فضة 925 صياغة يدوية فاخرة مرصع بالزركون السويسري." },
            { id: 2, mat: 'silver', cat: 'rings', name: "خاتم ومحبس سوليتير", price: 2800, img: "IMG_1762.jpeg", desc: "طقم الأناقة الخالدة لكل عروس." }
        ];

        function showProds(cat) {
            document.getElementById('sub-cats-view').style.display = 'none';
            document.getElementById('prods-view').style.display = 'block';
            const grid = document.getElementById('main-grid');
            const filtered = products.filter(p => p.mat === currentMat && p.cat === cat);
            grid.innerHTML = filtered.length ? filtered.map(p => `
                <div class="product-card" onclick="openProduct(${p.id})">
                    <img src="${p.img}" class="product-img">
                    <div style="padding:15px; font-weight:bold; font-size:15px;">${p.name}</div>
                    <div class="price-badge">TL ${p.price}</div>
                </div>
            `).join('') : '<p style="grid-column: 1/3; text-align:center; padding:50px; color:#888;">سيتم إضافة الموديلات الجديدة قريباً ✨</p>';
        }

        function openProduct(id) {
            const p = products.find(i => i.id === id);
            document.getElementById('d-img').src = p.img;
            document.getElementById('d-title').innerText = p.name;
            document.getElementById('d-price').innerText = "TL " + p.price;
            document.getElementById('d-desc').innerText = p.desc;
            document.getElementById('product-page').style.display = 'block';
        }

        function goHome() { document.getElementById('home-view').style.display='block'; document.getElementById('sub-cats-view').style.display='none'; }
        function backToSubCats() { document.getElementById('prods-view').style.display='none'; document.getElementById('sub-cats-view').style.display='block'; }
        function closeProduct() { document.getElementById('product-page').style.display='none'; }
        function addToCart() { cart.push(document.getElementById('d-title').innerText); document.getElementById('cart-num').innerText = cart.length; alert("تمت الإضافة للسلة ✅"); }
        function sendOrder() {
            if(!cart.length) return alert("السلة فارغة!");
            let msg = "طلب جديد من ريحانة ستور:\n" + cart.map((n, i) => `${i+1}. ${n}`).join("\n");
            window.location.href = `https://wa.me/905387091109?text=${encodeURIComponent(msg)}`;
        }
    </script>
</body>
</html>

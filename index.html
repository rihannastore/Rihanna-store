<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihanna Store | ريحانة ستور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&display=swap');

        :root { --main-black: #000; --main-white: #fff; --gold: #D4AF37; }
        body { 
            background-color: var(--main-white); 
            color: var(--main-black); 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            text-align: right; 
            overflow-x: hidden; 
        }

        /* شريط الإعلانات العريض والواضح */
        .announcement-bar { 
            background: var(--main-black); 
            color: var(--main-white); 
            font-size: 16px; 
            font-weight: 800; 
            padding: 15px 0; 
            overflow: hidden; 
            white-space: nowrap; 
            border-bottom: 2px solid var(--gold);
        }
        .scrolling-text { display: inline-block; animation: scrollLeft 25s linear infinite; }
        @keyframes scrollLeft { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee; }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 1px solid #000; object-fit: cover; }
        .brand-name { font-size: 26px; font-weight: 300; letter-spacing: 6px; margin-top: 15px; }

        /* بطاقات المجموعات */
        .category-card { 
            position: relative; 
            width: 92%; 
            margin: 15px auto; 
            height: 170px; 
            border-radius: 15px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-size: cover; 
            background-position: center; 
            border: 1px solid #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .category-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }
        .category-card span { position: relative; z-index: 2; color: #fff; font-size: 22px; font-weight: 800; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        /* شبكة المنتجات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; overflow: hidden; text-align: center; }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .price-badge { background: #000; color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-bottom: 10px; display: inline-block; }

        /* الشريط السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; z-index: 4000; border-top: 1px solid #eee; }
        .nav-item { color: #888; text-decoration: none; font-size: 11px; text-align: center; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: #000; }
    </style>
</head>
<body>

    <div class="announcement-bar">
        <div class="scrolling-text">✨ شحن مجاني لكافة ولايات تركيا 🇹🇷 ✨ صياغة يدوية فضة عيار 925 ✨ تشكيلة ÇELİK الفاخرة ✨</div>
    </div>

    <header>
        <img src="Logo_1789.jpg" class="logo">
        <h1 class="brand-name">RIHANNA STORE</h1>
    </header>

    <div id="home-view">
        <div class="category-card" style="background-image: url('IMG_1762.jpeg');" onclick="showSubCategories('silver')">
            <span>عالم الفضة 925</span>
        </div>
        <div class="category-card" style="background-image: url('https://images.pexels.com/photos/1458867/pexels-photo-1458867.jpeg?auto=compress&cs=tinysrgb&w=800');" onclick="showSubCategories('steel')">
            <span>مجموعة ÇELİK الفاخرة</span>
        </div>
    </div>

    <div id="sub-cats-view" style="display:none; padding: 20px 0;">
        <div onclick="goHome()" style="margin: 0 20px 20px; cursor:pointer; font-weight: 800;"><i class="fas fa-chevron-right"></i> العودة للرئيسية</div>
        <div id="sub-cats-list"></div>
    </div>

    <script>
        function showSubCategories(mat) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('sub-cats-view').style.display = 'block';
            const list = document.getElementById('sub-cats-list');
            
            const subCats = [
                {id:'set', n:'أطقم فاخرة', img:'IMG_1836.jpeg'}, // طقم الأحرف كما طلبتِ
                {id:'necklaces', n:'قلادات وسلاسل', img: 'https://images.pexels.com/photos/8664032/pexels-photo-8664032.jpeg?auto=compress&cs=tinysrgb&w=800'},
                {id:'rings', n:'خواتم ومحابس', img:'IMG_1762.jpeg'},
                {id:'women', n:'مصوغات نسائية (كاملة)', img:'https://images.pexels.com/photos/2850487/pexels-photo-2850487.jpeg?auto=compress&cs=tinysrgb&w=800'}, // صورة تجمع الرقي النسائي
                {id:'men', n:'مصوغات شبابية', img:'https://images.pexels.com/photos/8100511/pexels-photo-8100511.jpeg?auto=compress&cs=tinysrgb&w=800'},
                {id:'kids', n:'مصوغات الأطفال', img:'https://images.pexels.com/photos/10134440/pexels-photo-10134440.jpeg?auto=compress&cs=tinysrgb&w=800'}
            ];

            list.innerHTML = subCats.map(sc => `
                <div class="category-card" style="background-image: url('${sc.img}');" onclick="alert('سيتم عرض المنتجات قريباً')">
                    <span>${sc.n}</span>
                </div>
            `).join('');
        }

        function goHome() {
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('sub-cats-view').style.display = 'none';
        }
    </script>

    <nav class="bottom-nav">
        <a href="#" class="nav-item"><i class="fab fa-whatsapp"></i>تواصل</a>
        <div class="nav-item"><i class="fas fa-shopping-bag"></i>السلة</div>
        <div class="nav-item active" onclick="goHome()"><i class="fas fa-home"></i>الرئيسية</div>
        <a href="https://www.instagram.com/rihanna.store.tr?igsh=MWRkN2w5MWl2bTU1aw%3D%3D&utm_source=qr" class="nav-item"><i class="fab fa-instagram"></i>إنستا</a>
    </nav>
</body>
</html>

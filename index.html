<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihanna Store | ريحانة ستور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&display=swap');

        :root { --main-black: #000; --main-white: #fff; --gold: #D4AF37; }
        body { 
            background-color: var(--main-white); 
            color: var(--main-black); 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            text-align: right; 
            overflow-x: hidden; 
        }

        /* شريط الإعلانات: واضح جداً وعريض */
        .announcement-bar { 
            background: var(--main-black); 
            color: var(--main-white); 
            font-size: 16px; 
            font-weight: 800; 
            padding: 18px 0; 
            overflow: hidden; 
            white-space: nowrap; 
            border-bottom: 2px solid var(--gold);
        }
        .scrolling-text { display: inline-block; animation: scrollLeft 25s linear infinite; }
        @keyframes scrollLeft { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee; }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 1.5px solid #000; object-fit: cover; }
        .brand-name { font-size: 26px; font-weight: 300; letter-spacing: 7px; margin-top: 15px; }

        /* بطاقات المجموعات */
        .category-card { 
            position: relative; 
            width: 92%; 
            margin: 15px auto; 
            height: 180px; 
            border-radius: 22px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-size: cover; 
            background-position: center; 
            border: 1px solid #eee;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .category-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); }
        .category-card span { position: relative; z-index: 2; color: #fff; font-size: 24px; font-weight: 800; text-shadow: 2px 2px 5px rgba(0,0,0,0.6); }

        /* الشريط السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 15px 0; z-index: 4000; border-top: 2px solid #eee; }
        .nav-item { color: #888; text-decoration: none; font-size: 12px; text-align: center; font-weight: 500; }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 5px; }
        .nav-item.active { color: #000; }
    </style>
</head>
<body>

    <div class="announcement-bar">
        <div class="scrolling-text">✨ شحن مجاني لكافة ولايات تركيا 🇹🇷 ✨ صياغة يدوية فضة عيار 925 ✨ تشكيلة ÇELİK الفاخرة ✨</div>
    </div>

    <header>
        <img src="Logo_1789.jpg" class="logo">
        <h1 class="brand-name">RIHANNA STORE</h1>
    </header>

    <div id="home-view">
        <div class="category-card" style="background-image: url('IMG_1762.jpeg');" onclick="showSubCategories('silver')">
            <span>عالم الفضة 925</span>
        </div>
        <div class="category-card" style="background-image: url('IMG_1787.jpeg');" onclick="showSubCategories('steel')">
            <span>مجموعة ÇELİK الفاخرة</span>
        </div>
    </div>

    <div id="sub-cats-view" style="display:none; padding: 20px 0;">
        <div onclick="goHome()" style="margin: 0 25px 20px; cursor:pointer; font-weight: 800; font-size: 18px;"><i class="fas fa-chevron-right"></i> العودة للرئيسية</div>
        <div id="sub-cats-list"></div>
    </div>

    <script>
        function showSubCategories(mat) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('sub-cats-view').style.display = 'block';
            const list = document.getElementById('sub-cats-list');
            
            // ترتيب الصور بناءً على طلبك الأخير بدقة
            const subCats = [
                {id:'women', n:'المصوغات النسائية (كاملة)', img:'IMG_1787.jpeg'}, 
                {id:'set', n:'أطقم (طقم الأحرف)', img:'IMG_1836.jpeg'}, 
                {id:'rings', n:'خواتم (سوليتير)', img:'IMG_1762.jpeg'}, 
                {id:'necklaces', n:'قلادات وسلاسل', img:'image.png'}, // صورتك للقلادة
                {id:'couple', n:'كابلز (خواتم ثنائية)', img:'image.png'}, // صورة الخواتم سوى
                {id:'kids', n:'مصوغات الأطفال', img:'image.png'}, // صورة بلاك الطفل
                {id:'men', n:'مصوغات الرجال (مسبحة)', img:'image.png'}, // صورة المسبحة
                {id:'boxes', n:'بوكسات هدايا ريحانة 🎁', img:'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=1000'}
            ];

            list.innerHTML = subCats.map(sc => `
                <div class="category-card" style="background-image: url('${sc.img}');" onclick="alert('سيتم عرض منتجات ${sc.n} قريباً')">
                    <span>${sc.n}</span>
                </div>
            `).join('');
        }

        function goHome() {
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('sub-cats-view').style.display = 'none';
        }
    </script>

    <nav class="bottom-nav">
        <a href="https://wa.me/905387091109" class="nav-item"><i class="fab fa-whatsapp"></i>تواصل</a>
        <div class="nav-item"><i class="fas fa-shopping-bag"></i>السلة</div>
        <div class="nav-item active" onclick="goHome()"><i class="fas fa-home"></i>الرئيسية</div>
        <a href="https://www.instagram.com/rihanna.store.tr?igsh=MWRkN2w5MWl2bTU1aw%3D%3D&utm_source=qr" class="nav-item"><i class="fab fa-instagram"></i>إنستا</a>
    </nav>
</body>
</html>
